<svg xmlns='http://www.w3.org/2000/svg' width='800' height='450' viewBox='0 0 800 450' role='img' aria-label='Sudut lepas 30, 45, dan 60 derajat; 45 derajat menghasilkan jarak terjauh'><title>Sudut lepas 30, 45, dan 60 derajat; 45 derajat menghasilkan jarak terjauh</title><defs><linearGradient id='lg' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#E6FAF6'/><stop offset='1' stop-color='#F4FDFB'/></linearGradient></defs><rect width='800' height='450' rx='28' fill='url(#lg)'/><rect y='370' width='800' height='80' fill='#BDE8C8'/><rect width='800' height='450' rx='28' fill='none' stroke='#2B1A3F' stroke-width='6'/><line x1='60' y1='380' x2='770' y2='380' stroke='#2B1A3F' stroke-width='4'/><g transform='translate(80 380) scale(1)'><circle r='10' fill='#2B1A3F'/></g><path d='M80 380 Q360.0 240 640 380' fill='none' stroke='#94A3B8' stroke-width='3' stroke-dasharray='10 8'/><g><animateMotion path='M80 380 Q360.0 240 640 380' dur='3s' begin='0s' repeatCount='indefinite'/><g><circle r='10' fill='#94A3B8' stroke='#2B1A3F' stroke-width='3.5'/></g></g><g transform='translate(620 405)'><rect x='-51.32000000000001' y='-17' width='102.64000000000001' height='34' rx='17' fill='#64748B' stroke='#2B1A3F' stroke-width='3'/><text y='6' text-anchor='middle' font-family='Nunito, Segoe UI, Arial, sans-serif' font-weight='900' font-size='16' fill='#fff'>30° = 60°</text></g><path d='M80 380 Q405.0 140 730 380' fill='none' stroke='#0D9488' stroke-width='3' stroke-dasharray='10 8'/><g><animateMotion path='M80 380 Q405.0 140 730 380' dur='3s' begin='1s' repeatCount='indefinite'/><g><circle r='10' fill='#0D9488' stroke='#2B1A3F' stroke-width='3.5'/></g></g><g transform='translate(730 405)'><rect x='-24.44' y='-17' width='48.88' height='34' rx='17' fill='#0D9488' stroke='#2B1A3F' stroke-width='3'/><text y='6' text-anchor='middle' font-family='Nunito, Segoe UI, Arial, sans-serif' font-weight='900' font-size='16' fill='#fff'>45°</text></g><path d='M80 380 Q360.0 30 640 380' fill='none' stroke='#7A3FD1' stroke-width='3' stroke-dasharray='10 8'/><g><animateMotion path='M80 380 Q360.0 30 640 380' dur='3s' begin='2s' repeatCount='indefinite'/><g><circle r='10' fill='#7A3FD1' stroke='#2B1A3F' stroke-width='3.5'/></g></g><g transform='translate(600 110)'><rect x='-172.28000000000003' y='-17' width='344.56000000000006' height='34' rx='17' fill='#0D9488' stroke='#2B1A3F' stroke-width='3'/><text y='6' text-anchor='middle' font-family='Nunito, Segoe UI, Arial, sans-serif' font-weight='900' font-size='16' fill='#fff'>45° = terjauh (tanpa hambatan udara)</text></g><text x='330' y='60' text-anchor='middle' font-family='Nunito, Segoe UI, Arial, sans-serif' font-weight='900' font-size='30' fill='#0D9488' stroke='#fff' stroke-width='7' paint-order='stroke'>Sudut lepas memengaruhi jarak</text></svg>